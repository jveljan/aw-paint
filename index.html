<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aw-paint</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<aside class="panel tools" id="tools">
 <button class="on" data-tool="brush" title="Brush"><svg viewBox="0 0 24 24"><path d="M3 21c3 0 5-1 5-4a3 3 0 0 1 3-3l9-9a2.1 2.1 0 0 0-3-3l-9 9a3 3 0 0 1-3 3c-3 0-2 4-2 7z"/></svg></button>
 <button data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M20 20H9L3 14a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-8 8"/></svg></button>
 <div class="sep"></div>
 <button data-tool="line" title="Line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
 <button data-tool="rectangle" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
 <button data-tool="circle" title="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
 <button data-tool="text" title="Text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
</aside>

<main>
 <header class="panel">
  <div class="logo"><i></i>Paint</div>
  <div class="sw" id="sw"><b class="on" data-c="#7c5cff"></b><b data-c="#111827"></b><b data-c="#ef4444"></b><b data-c="#22c55e"></b><b data-c="#0ea5e9"></b><b data-c="#f59e0b"></b></div>
  <input type="range" min="1" max="30" value="6" id="size" title="Size">
  <span class="sp"></span>
  <span class="mut" id="where"></span>
  <label class="tg"><input type="checkbox" id="auto" checked><span></span><em>Auto-correct</em></label>
  <button class="btn" id="undo">Undo</button><button class="btn" id="clr">Clear</button>
  <button class="btn" id="png">PNG</button>
  <button class="btn agent" id="play">✦ Agent draws</button>
 </header>

 <section class="panel stage">
  <canvas id="c" width="1200" height="800"></canvas>
  <div class="badge" id="badge"><i></i>Agent is drawing</div>
 </section>

 <div class="panel log"><b>agent ▸</b><code id="log">waiting for tool calls…</code></div>
</main>
</div>

<div id="cur"><svg viewBox="0 0 24 24" style="fill:#ff8a4c;stroke:#fff;stroke-width:1.5"><path d="M3 3l7 18 2.5-7.5L20 11z"/></svg><span>Agent</span></div>

<script type="module" src="app.js"></script>
</body>
</html>
